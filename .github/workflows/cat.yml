name: 🐱 Cat of the Minute

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cat:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🐱 Update README
        run: python scripts/update_cat.py

      - name: 🚀 Commit & Push
        run: |
          git config user.name "codingwithmaajid"
          git config user.email "abdulmaajid7002@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🐱 Update cat image"
            git push
          fi